<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Guard</title>
<style>
:root{
  --bg:#f3f4fb; --surface:#fff; --surface2:#f8f9fe; --ink:#161a30; --mute:#6a7090; --line:#e5e8f3;
  --brand:#6c5ce7; --brand2:#ff4d8d; --grad:linear-gradient(135deg,#6c5ce7 0%,#ff4d8d 100%);
  --ok:#0f9d68; --okbg:#e3f6ee; --warn:#d97706; --warnbg:#fdf0dc; --bad:#e0383e; --badbg:#fde8e9; --info:#2563eb; --infobg:#e5eeff;
  --shadow:0 1px 2px rgba(22,26,48,.05),0 10px 28px rgba(22,26,48,.07); --ring:0 0 0 3px rgba(108,92,231,.22);
  --side:#12142b; --side2:#1b1e3f; --sideink:#c9cdee; --sidemute:#8087b8;
}
html[data-theme=dark]{
  --bg:#0d0f1f; --surface:#171a30; --surface2:#1d2140; --ink:#eceffd; --mute:#9aa1c7; --line:#292e52;
  --ok:#4cd6a0; --okbg:#10352a; --warn:#f3a64a; --warnbg:#3b2a10; --bad:#ff7a80; --badbg:#3d171a; --info:#7aa7ff; --infobg:#172a52;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); --side:#0a0b19; --side2:#14173a;
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,"Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
::selection{background:rgba(108,92,231,.25)}
#app{display:grid;grid-template-columns:256px 1fr;height:100vh}
/* ---- sidebar */
aside{background:linear-gradient(180deg,var(--side),var(--side2));color:var(--sideink);display:flex;flex-direction:column;padding:20px 14px;gap:6px;overflow:auto}
.logo{display:flex;align-items:center;gap:11px;padding:4px 10px 18px;color:#fff}
.logo .mark{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 18px rgba(255,77,141,.35)}
.logo b{font-size:16.5px;letter-spacing:.2px;display:block;line-height:1.1}.logo small{color:var(--sidemute);font-size:11.5px}
nav{display:flex;flex-direction:column;gap:3px}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--sideink);text-decoration:none;font-weight:550;position:relative;transition:.15s}
nav a:hover{background:rgba(255,255,255,.06)}
nav a.on{background:rgba(255,255,255,.1);color:#fff}
nav a.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--grad)}
nav a .badge{margin-left:auto;background:var(--brand2);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.side-foot{margin-top:auto;display:grid;gap:10px;padding:14px 8px 4px;border-top:1px solid rgba(255,255,255,.08)}
.side-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.side-row small{color:var(--sidemute)}
.activity-wrap{padding:0 8px;display:grid;gap:8px}
.activity{display:grid;gap:3px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.08);font-size:12.5px;line-height:1.35}
.activity .t{display:flex;gap:8px;align-items:center;font-weight:600}.activity small{color:var(--sidemute);word-break:break-word}
.meter{height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}.meter i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .4s}
/* ---- main */
main{overflow:auto;position:relative}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:16px 32px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.topbar h2{margin:0;font-size:21px;letter-spacing:-.2px}.topbar .sub{color:var(--mute);font-size:13.5px}
.topbar .grow{flex:1}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--mute)}
.icon-btn:hover{color:var(--ink);border-color:var(--brand)}
#results,#recent,#progress{scroll-margin-top:92px}
#view{padding:6px 32px 56px;max-width:1120px;margin:0 auto;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
svg.ic{width:18px;height:18px;flex:none}
/* ---- building blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px}
.card h3{margin:0 0 4px;font-size:16px}.card .lead{color:var(--mute);margin:0 0 14px;font-size:13.5px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}.grow{flex:1 1 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--grad);color:#fff;border:0;box-shadow:0 6px 16px rgba(108,92,231,.3)}
.btn.primary:hover:not(:disabled){color:#fff;filter:brightness(1.06);transform:translateY(-1px)}
.btn.soft{background:var(--surface2)}.btn.danger:hover:not(:disabled){border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}.btn.ghost{border-color:transparent;background:transparent;color:var(--mute)}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:10px 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:var(--ring);background:var(--surface)}
textarea{resize:vertical;min-height:84px;line-height:1.5}
select{width:auto;min-width:150px;padding-right:30px}
label.field{display:grid;gap:6px;font-weight:600;font-size:13px}label.field small{font-weight:400;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:2px 10px;border-radius:99px;background:var(--surface2);color:var(--mute);border:1px solid var(--line)}
.chip.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.chip.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--badbg);color:var(--bad);border-color:transparent}.chip.info{background:var(--infobg);color:var(--info);border-color:transparent}
.muted{color:var(--mute)}.small{font-size:13px}.mt{margin-top:14px}.mt2{margin-top:22px}
.switch{position:relative;display:inline-block;width:46px;height:26px;flex:none}.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;left:3px;top:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--ok)}.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{box-shadow:var(--ring)}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite;display:inline-block;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;background:var(--infobg);color:var(--info);font-size:13.5px}
.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.bad{background:var(--badbg);color:var(--bad)}.banner.ok{background:var(--okbg);color:var(--ok)}
.empty{text-align:center;padding:38px 20px;color:var(--mute)}.empty .big{font-size:34px;margin-bottom:6px}.empty b{color:var(--ink);display:block;font-size:16px;margin-bottom:3px}
.skel{border-radius:12px;background:linear-gradient(90deg,var(--surface2) 25%,var(--line) 50%,var(--surface2) 75%);background-size:200% 100%;animation:sk 1.2s infinite;height:84px}
@keyframes sk{to{background-position:-200% 0}}
/* ---- home */
.hero{border-radius:22px;padding:34px 34px 26px;color:#fff;background:var(--grad);position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(108,92,231,.28)}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{margin:0 0 6px;font-size:27px;letter-spacing:-.4px;position:relative}.hero p{margin:0 0 20px;opacity:.92;position:relative;max-width:620px}
.urlbox{display:flex;gap:8px;background:#fff;border-radius:15px;padding:7px;box-shadow:0 8px 24px rgba(0,0,0,.18);position:relative;align-items:center}
.urlbox .ic{color:#8a90b3;margin-left:10px}.urlbox input{border:0;background:transparent;box-shadow:none;padding:11px 6px;color:#161a30;font-size:15px}
.urlbox input::placeholder{color:#9aa0c0}.urlbox input:focus{box-shadow:none;background:transparent}
.urlbox .btn.paste{background:#f1f2fb;color:#4a4f73;border:0}
.hero-opts{display:flex;gap:12px;align-items:center;margin-top:14px;font-size:13.5px;position:relative;flex-wrap:wrap}
.hero-opts select{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff}.hero-opts select option{color:#161a30}
.hero .err{margin-top:10px;background:rgba(0,0,0,.22);padding:9px 13px;border-radius:11px;position:relative}
.stat{display:grid;gap:8px}.stat .k{color:var(--mute);font-size:12.5px;font-weight:650;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:7px}
.stat .v{font-size:25px;font-weight:750;letter-spacing:-.5px}.stat .meter{background:var(--line)}.stat .meter i{background:var(--grad)}
.stat .hint{font-size:12.5px;color:var(--mute)}
.progress-card .steps{display:flex;gap:6px;margin:12px 0 4px}
.step{flex:1;padding:7px 10px;border-radius:10px;background:var(--surface2);font-size:12.5px;font-weight:650;color:var(--mute);display:flex;align-items:center;gap:7px}
.step.on{background:var(--infobg);color:var(--info)}.step.done{background:var(--okbg);color:var(--ok)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .35s}
.post-head{display:flex;gap:14px;align-items:flex-start}.post-ico{width:46px;height:46px;border-radius:13px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none}
.post-head h3{margin:0 0 2px;font-size:15.5px}.post-head .desc{color:var(--mute);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tabs{display:flex;gap:6px;margin:18px 0 12px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:650;font-size:13.5px;color:var(--mute)}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.tab .n{opacity:.7;margin-left:5px;font-weight:600}
.cc{border:1px solid var(--line);border-radius:15px;background:var(--surface);padding:15px 17px;display:grid;gap:10px;transition:.15s}
.cc:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.cc-top{display:flex;gap:11px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:750;flex:none;text-transform:uppercase}
.cc-top .who{font-weight:700}.cc-top .meta{color:var(--mute);font-size:12.5px;display:flex;gap:10px;align-items:center}
.cc-text{font-size:15px;white-space:pre-wrap;word-break:break-word}
.why{color:var(--mute);font-size:13px;font-style:italic}
.cc-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.composer{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:10px}
.counter{font-size:12px;color:var(--mute);text-align:right}.counter.over{color:var(--warn);font-weight:650}
.status-line{display:flex;gap:9px;align-items:flex-start;font-size:13.5px}
.proof{display:flex;gap:12px;align-items:center;margin-top:6px}
.proof img{width:150px;max-height:110px;object-fit:cover;object-position:top;border-radius:11px;border:1px solid var(--line);cursor:zoom-in;transition:.15s}
.proof img:hover{transform:scale(1.03);border-color:var(--brand)}
.list-row{display:grid;gap:8px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface)}
.quote{border-left:3px solid var(--line);padding-left:11px;color:var(--mute);white-space:pre-wrap}
.acct{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:15px;padding:15px 17px;background:var(--surface)}
.acct .avatar{width:44px;height:44px;font-size:17px}.acct .name{font-weight:700}.acct .grow{min-width:0}
.flow{border:1.5px solid var(--brand);border-radius:16px;padding:16px 18px;background:color-mix(in srgb,var(--brand) 6%,var(--surface))}
.flow.done{border-color:var(--ok)}.flow.failed{border-color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(8,9,20,.78);display:grid;place-items:center;z-index:50;padding:30px;animation:fade .15s}
.modal .box{background:var(--surface);border-radius:18px;padding:18px;max-width:min(92vw,1000px);max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
.modal img{max-width:100%;max-height:78vh;display:block;border-radius:10px}
.kbd{font:12px ui-monospace,Consolas,monospace;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
table.map{width:100%;border-collapse:collapse;font-size:13.5px}table.map td,table.map th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.map th{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
@media(max-width:900px){#app{grid-template-columns:72px 1fr}.activity small,.activity .t span{display:none}.logo div,nav a span.t,.side-foot .side-row small,.side-foot .lbl{display:none}nav a{justify-content:center;padding:12px}nav a .badge{position:absolute;top:2px;right:6px;margin:0}
 .topbar,#view{padding-left:18px;padding-right:18px}.hero{padding:24px 20px}}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="logo"><div class="mark" id="logo-mark"></div><div><b>TikTok Guard</b><small>Comment desk</small></div></div>
    <nav id="nav"></nav>
    <div class="activity-wrap" id="side-activity" aria-live="polite"></div>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <main>
    <div class="topbar"><div><h2 id="page-title"></h2><div class="sub" id="page-sub"></div></div><div class="grow"></div><button class="icon-btn" id="theme" title="Light / dark"></button></div>
    <div id="view"></div>
  </main>
</div>
<script>
"use strict";
/* ================================================================ helpers */
const $ = (sel, el = document) => el.querySelector(sel);
const ICONS = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  replies:'<path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  ai:'<path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4z"/><path d="M19 15l.8 1.9 1.9.8-1.9.8L19 20.4l-.8-1.9-1.9-.8 1.9-.8z"/>',
  sliders:'<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
  help:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  search:'<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  paste:'<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/>',
  send:'<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
  check:'<polyline points="20 6 9 17 4 12"/>', x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  refresh:'<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>',
  trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>',
  moon:'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  sun:'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
  alert:'<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  heart:'<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',
  down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
  star:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  broom:'<path d="M19 3l-6 6"/><path d="M14.5 8.5l-9 9a2.1 2.1 0 0 0 3 3l9-9"/><path d="M4 21l3-3"/>',
};
function icon(name, size) {
  const svg = new DOMParser().parseFromString('<svg xmlns="http://www.w3.org/2000/svg" class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || '') + '</svg>', 'image/svg+xml').documentElement;

/* ================================================================ boot */
async function boot() {
  initTheme(); renderNav();
  try { await api('GET', '/api/ping'); } catch (e) { return showError(e.message); }
  if (!S.token) return askToken();
  try { await loadDash(); } catch (e) { if (e.code === 'unauthorized') return askToken(); showError(e.message); }
  if (!location.hash || location.hash.includes('token=')) history.replaceState(null, '', location.pathname + '#/home');
  route(); pollActivity();
}
boot();
